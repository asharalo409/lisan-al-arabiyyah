    function showMenu() {
      document.getElementById("menu").style.display = "block";
      document.getElementById("page").style.display = "none";
    }

    function openLesson(index) {
      const lesson = lessons[index];

      document.getElementById("menu").style.display = "none";
      document.getElementById("page").style.display = "block";
      document.getElementById("title").textContent = lesson.title;

      const linesBox = document.getElementById("lines");
      linesBox.innerHTML = "";

      for (let i = 0; i < lesson.lines.length; i++) {
        const box = document.createElement("div");
        box.className = "line";

        const arabic = document.createElement("div");
        arabic.className = "arabic";
        arabic.textContent = (i + 1) + ". " + lesson.lines[i][0];

        const bangla = document.createElement("div");
        bangla.className = "bangla";
        bangla.textContent = lesson.lines[i][1];

        const button = document.createElement("button");
        button.className = "listen";
        button.textContent = "🔊 শুনুন";

        button.onclick = function () {
          const speech = new SpeechSynthesisUtterance(lesson.lines[i][0]);
          speech.lang = "ar-SA";
          speech.rate = 0.75;
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(speech);
        };

        box.appendChild(arabic);
        box.appendChild(bangla);
        box.appendChild(button);

        linesBox.appendChild(box);
      }

      window.scrollTo(0, 0);
    }

    for (let i = 0; i < lessons.length; i++) {
      const button = document.createElement("button");

      button.className = "lesson-button";
      button.textContent = lessons[i].title;

      button.onclick = function () {
        openLesson(i);
      };

      document.getElementById("menu").appendChild(button);
    }
