<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AI আরবি শিক্ষক | لِسَانُ العَرَبِيَّة</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0B5D3B" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans Arabic", sans-serif;
      background: #f6f7f2;
      color: #18352a;
    }

    .app {
      position: relative;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      background: #ffffff;
      padding-bottom: 90px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, #0b5d3b, #15835a);
      color: white;
      padding: 18px 16px;
    }

    .back-button {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.18);
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    .header h1 {
      font-size: 20px;
    }

    .header p {
      margin-top: 3px;
      font-size: 12px;
      opacity: 0.9;
    }

    .teacher-card {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px;
      padding: 14px;
      border-radius: 16px;
      background: #e8f6ee;
      border: 1px solid #b8e0c7;
    }

    .teacher-avatar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #087443;
      color: white;
      font-size: 23px;
    }

    .teacher-card h2 {
      color: #075b34;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .teacher-card p {
      color: #476158;
      font-size: 12px;
      line-height: 1.5;
    }

    .chat-area {
      padding: 0 16px 16px;
    }

    .message-row {
      display: flex;
      margin-bottom: 13px;
    }

    .message-row.teacher {
      justify-content: flex-start;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message {
      max-width: 85%;
      padding: 12px 14px;
      border-radius: 15px;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-line;
    }

    .teacher-message {
      background: #eef5f0;
      color: #244738;
      border-bottom-left-radius: 4px;
    }

    .user-message {
      background: #087443;
      color: white;
      border-bottom-right-radius: 4px;
      direction: rtl;
      text-align: right;
      font-size: 17px;
    }

    .arabic {
      direction: rtl;
      text-align: right;
      font-size: 18px;
      font-weight: bold;
      margin: 5px 0;
    }

    .quick-title {
      margin: 8px 16px 10px;
      color: #52635b;
      font-size: 13px;
      font-weight: bold;
    }

    .quick-replies {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 16px 12px;
    }

    .quick-button {
      flex: 0 0 auto;
      padding: 9px 12px;
      border: 1px solid #b8e0c7;
      border-radius: 20px;
      background: #f6fff9;
      color: #087443;
      font-size: 13px;
      cursor: pointer;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 520px;
      padding: 11px 12px;
      background: white;
      border-top: 1px solid #e6ebe7;
    }

    .chat-input {
      flex: 1;
      min-width: 0;
      padding: 12px 13px;
      border: 1px solid #cddbd2;
      border-radius: 12px;
      font-family: Arial, "Noto Sans Arabic", sans-serif;
      font-size: 15px;
      outline: none;
    }

    .chat-input:focus {
      border-color: #087443;
    }

    .send-button {
      width: 47px;
      border: none;
      border-radius: 12px;
      background: #087443;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main class="app">

    <header class="header">
      <button class="back-button" onclick="window.location.href='index.html'">←</button>

      <div>
        <h1>AI আরবি শিক্ষক</h1>
        <p>تَحَدَّثْ مَعَ مُعَلِّمِكَ</p>
      </div>
    </header>

    <section class="teacher-card">
      <div class="teacher-avatar">🤖</div>

      <div>
        <h2>আপনার আরবি শিক্ষক</h2>
        <p>আরবিতে লিখুন। আমি উত্তর, উচ্চারণ, অর্থ ও সহজ ব্যাখ্যা দেব।</p>
      </div>
    </section>

    <section class="chat-area" id="chatArea">
      <div class="message-row teacher">
        <div class="message teacher-message">
          اَلسَّلَامُ عَلَيْكُمْ!<br />
          আস-সালামু আলাইকুম!<br />
          আমি আপনার আরবি শিক্ষক। আজ আমরা আরবিতে সহজ কথোপকথন অনুশীলন করব। আপনি আরবিতে লিখুন।
        </div>
      </div>
    </section>

    <p class="quick-title">দ্রুত অনুশীলন করুন</p>

    <section class="quick-replies">
      <button class="quick-button" onclick="sendQuickMessage('اَلسَّلَامُ عَلَيْكُمْ')">
        اَلسَّلَامُ عَلَيْكُمْ
      </button>

      <button class="quick-button" onclick="sendQuickMessage('كَيْفَ حَالُكَ؟')">
        كَيْفَ حَالُكَ؟
      </button>

      <button class="quick-button" onclick="sendQuickMessage('اِسْمِي نَاصِرٌ')">
        اِسْمِي نَاصِرٌ
      </button>

      <button class="quick-button" onclick="sendQuickMessage('أَنَا مِنْ بَنْغَلَادِيشَ')">
        أَنَا مِنْ بَنْغَلَادِيشَ
      </button>
    </section>

    <section class="input-area">
      <input
        class="chat-input"
        id="chatInput"
        type="text"
        placeholder="আরবিতে লিখুন..."
        onkeypress="handleEnter(event)"
      />

      <button class="send-button" onclick="sendMessage()">➤</button>
    </section>

  </main>

  <script>
    function handleEnter(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }

    function sendQuickMessage(message) {
      document.getElementById("chatInput").value = message;
      sendMessage();
    }

    function addUserMessage(text) {
      const chatArea = document.getElementById("chatArea");

      const row = document.createElement("div");
      row.className = "message-row user";

      const message = document.createElement("div");
      message.className = "message user-message";
      message.innerText = text;

      row.appendChild(message);
      chatArea.appendChild(row);

      scrollToBottom();
    }

    function addTeacherMessage(text) {
      const chatArea = document.getElementById("chatArea");

      const row = document.createElement("div");
      row.className = "message-row teacher";

      const message = document.createElement("div");
      message.className = "message teacher-message";
      message.innerHTML = text;

      row.appendChild(message);
      chatArea.appendChild(row);

      scrollToBottom();
    }

    function getTeacherReply(text) {
      const input = text.trim().toLowerCase();

      if (
        input.includes("السلام عليكم") ||
        input.includes("اَلسَّلَامُ عَلَيْكُمْ")
      ) {
        return `
          <div class="arabic">وَعَلَيْكُمُ السَّلَامُ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ</div>
          <strong>উচ্চারণ:</strong> ওয়া আলাইকুমুস সালাম ওয়া রহমাতুল্লাহি ওয়া বারাকাতুহ।<br />
          <strong>অর্থ:</strong> আপনার ওপরও শান্তি, আল্লাহর রহমত ও বরকত বর্ষিত হোক।<br /><br />
          <strong>শিক্ষা:</strong> আপনার সালামটি সঠিক ছিল। মাশাআল্লাহ!
        `;
      }

      if (
        input.includes("كيف حالك") ||
        input.includes("كَيْفَ حَالُكَ")
      ) {
        return `
          <div class="arabic">أَنَا بِخَيْرٍ، اَلْحَمْدُ لِلّٰهِ</div>
          <strong>উচ্চারণ:</strong> আনা বিখাইরিন, আলহামদু লিল্লাহ।<br />
          <strong>অর্থ:</strong> আমি ভালো আছি, আলহামদুলিল্লাহ।<br /><br />
          <strong>ব্যাখ্যা:</strong> كَيْفَ অর্থ “কেমন”, আর حَالُكَ অর্থ “তোমার অবস্থা”।
        `;
      }

      if (
        input.includes("اسمي") ||
        input.includes("اِسْمِي")
      ) {
        return `
          <div class="arabic">تَشَرَّفْتُ بِمَعْرِفَتِكَ</div>
          <strong>উচ্চারণ:</strong> তাশাররাফতু বিমা‘রিফাতিক।<br />
          <strong>অর্থ:</strong> আপনার সঙ্গে পরিচিত হয়ে আনন্দিত হলাম।<br /><br />
          <strong>ব্যাখ্যা:</strong> اِسْمِي অর্থ “আমার নাম”। আপনার বাক্যের গঠন সুন্দর হয়েছে।
        `;
      }

      if (
        input.includes("بنغلاديش") ||
        input.includes("بَنْغَلَادِيش")
      ) {
        return `
          <div class="arabic">أَهْلًا وَسَهْلًا بِكَ مِنْ بَنْغَلَادِيشَ</div>
          <strong>উচ্চারণ:</strong> আহলান ওয়া সাহলান বিকা মিন বাংলাদীশ।<br />
          <strong>অর্থ:</strong> বাংলাদেশ থেকে আপনাকে স্বাগতম।<br /><br />
          <strong>ব্যাখ্যা:</strong> أَنَا مِنْ بَنْغَلَادِيشَ অর্থ “আমি বাংলাদেশ থেকে এসেছি।”
        `;
      }

      return `
        <div class="arabic">أَحْسَنْتَ! حَاوِلْ أَنْ تَكْتُبَ جُمْلَةً قَصِيرَةً.</div>
        <strong>উচ্চারণ:</strong> আহসানতা! হাওয়িল আন তাক্তুবা জুমলাতান কাসীরাহ।<br />
        <strong>অর্থ:</strong> ভালো চেষ্টা! একটি ছোট বাক্য লেখার চেষ্টা করুন।<br /><br />
        উদাহরণ: <strong>أَنَا طَالِبٌ</strong> — আমি একজন ছাত্র।
      `;
    }

    function sendMessage() {
      const input = document.getElementById("chatInput");
      const text = input.value.trim();

      if (text === "") {
        return;
      }

      addUserMessage(text);
      input.value = "";

      setTimeout(function () {
        addTeacherMessage(getTeacherReply(text));
      }, 500);
    }

    function scrollToBottom() {
      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("service-worker.js");
      });
    }
  </script>
</body>
</html>
