function back(){
  document.getElementById("menu").style.display="block";
  document.getElementById("page").style.display="none";
}

function openLesson(index){
  const lesson=lessons[index];

  document.getElementById("menu").style.display="none";
  document.getElementById("page").style.display="block";
  document.getElementById("title").textContent=lesson.title;

  const linesBox=document.getElementById("lines");
  linesBox.innerHTML="";

  lesson.lines.forEach((item,i)=>{
    const box=document.createElement("div");
    box.className="line";

    const arabic=document.createElement("div");
    arabic.className="ar";
    arabic.textContent=(i+1)+". "+item[0];

    const bangla=document.createElement("div");
    bangla.className="bn";
    bangla.textContent=item[1];

    const button=document.createElement("button");
    button.className="listen";
    button.textContent="🔊 শুনুন";

    button.onclick=function(){
      const speech=new SpeechSynthesisUtterance(item[0]);
      speech.lang="ar-SA";
      speech.rate=0.75;

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(speech);
    };

    box.appendChild(arabic);
    box.appendChild(bangla);
    box.appendChild(button);

    linesBox.appendChild(box);
  });

  window.scrollTo(0,0);
}

lessons.forEach((lesson,index)=>{
  const button=document.createElement("button");

  button.className="lesson";
  button.textContent=lesson.title;

  button.onclick=function(){
    openLesson(index);
  };

  document.getElementById("menu").appendChild(button);
});
</script>
