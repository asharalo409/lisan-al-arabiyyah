<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>আরবি AI স্যার</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef6f1;
      color: #183b2c;
    }

    .app {
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding-bottom: 95px;
    }

    header {
      padding: 22px 18px 28px;
      color: white;
      background: linear-gradient(135deg, #075b34, #138555);
      border-radius: 0 0 25px 25px;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    header p {
      margin: 9px 0 0;
      font-size: 14px;
      line-height: 1.6;
    }

    .teacher-box {
      margin: -12px 16px 18px;
      padding: 16px;
      text-align: center;
      background: #e7f6ed;
      border: 1px solid #b7dec6;
      border-radius: 18px;
    }

    .teacher-icon {
      font-size: 52px;
    }

    .teacher-box h2 {
      margin: 6px 0;
      color: #075b34;
      font-size: 18px;
    }

    .teacher-box p {
      margin: 0;
      color: #557064;
      font-size: 13px;
    }

    #chatArea {
      padding: 0 16px;
    }

    .message {
      max-width: 90%;
      margin: 12px 0;
      padding: 13px;
      border-radius: 15px;
      line-height: 1.7;
      font-size: 14px;
    }

    .teacher-message {
      background: #e8f6ee;
      border: 1px solid #b8e0c7;
      border-top-left-radius: 3px;
    }

    .user-message {
      margin-left: auto;
      color: white;
      background: #087443;
      border-top-right-radius: 3px;
      text-align: right;
      direction: rtl;
      font-size: 17px;
    }

    .name {
      display: block;
      margin-bottom: 6px;
      color: #087443;
      font-size: 12px;
      font-weight: bold;
    }

    .user-message .name {
      color: #d9f5e4;
    }

    .arabic {
      color: #075b34;
      font-size: 21px;
      line-height: 1.9;
      text-align: right;
      direction: rtl;
    }

    .bangla {
      margin-top: 7px;
      color: #4c6257;
    }

    .correction {
      margin-top: 9px;
      padding: 8px;
      color: #69530f;
      background: #fff7d8;
      border: 1px solid #edda8a;
      border-radius: 9px;
      font-size: 13px;
    }

    .listen {
      margin-top: 9px;
      padding: 8px 10px;
      color: #075b34;
      background: #d4f0df;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
    }

    #typing {
      display: none;
      padding: 12px 18px;
      color: #61786d;
      font-size: 13px;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 50%;
      width: 100%;
      max-width: 520px;
      padding: 10px;
      background: white;
      border-top: 1px solid #dbe6df;
      transform: translateX(-50%);
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      height: 48px;
      padding: 10px;
      border: 1px solid #bfd0c5;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
      text-align: right;
      direction: rtl;
    }

    .button {
      width: 48px;
      border: 0;
      border-radius: 12px;
      color: white;
      font-size: 19px;
    }

    .mic {
      background: #c94d40;
    }

    .send {
      background: #087443;
    }
  </style>
</head>

<body>
  <main class="app">

    <header>
      <h1>আরবি AI স্যার</h1>
      <p>বাংলা লিখুন, আরবি লিখুন অথবা মাইকে আরবিতে বলুন।</p>
    </header>

    <section class="teacher-box">
      <div class="teacher-icon" id="teacherIcon">👨‍🏫</div>
      <h2 id="teacherName">আরবি AI স্যার</h2>
      <p id="status">আমি আপনার কথা শুনছি।</p>
    </section>

    <section id="chatArea">
      <div class="message teacher-message">
        <span class="name">👨‍🏫 AI স্যার</span>

        <div class="arabic">أَلسَّلَامُ عَلَيْكُمْ</div>

        <div class="bangla">
          আসসালামু আলাইকুম। আরবিতে বা বাংলায় লিখুন।
        </div>

        <button class="listen" onclick="speakArabic('أَلسَّلَامُ عَلَيْكُمْ')">
          🔊 আরবিতে শুনুন
        </button>
      </div>
    </section>

    <div id="typing">👨‍🏫 AI স্যার উত্তর লিখছেন...</div>

    <section class="bottom">
      <div class="input-row">
        <button class="button mic" onclick="startListening()">🎙️</button>

        <input
          id="messageInput"
          placeholder="বাংলা বা আরবিতে লিখুন"
          onkeydown="handleEnter(event)"
        >

        <button class="button send" onclick="sendMessage()">➤</button>
      </div>
    </section>

  </main>

  <script>
    let teacherGender = "male";

    function handleEnter(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }

    function updateTeacherGender(message) {
      if (
        message.includes("তুমি মেয়ে") ||
        message.includes("মেয়ে হয়ে") ||
        message.includes("মহিলা হয়ে")
      ) {
        teacherGender = "female";

        document.getElementById("teacherIcon").textContent = "👩‍🏫";
        document.getElementById("teacherName").textContent = "আরবি AI ম্যাডাম";
      }

      if (
        message.includes("তুমি ছেলে") ||
        message.includes("ছেলে হয়ে") ||
        message.includes("পুরুষ হয়ে")
      ) {
        teacherGender = "male";

        document.getElementById("teacherIcon").textContent = "👨‍🏫";
        document.getElementById("teacherName").textContent = "আরবি AI স্যার";
      }
    }

    async function sendMessage() {
      const input = document.getElementById("messageInput");
      const message = input.value.trim();

      if (!message) {
        return;
      }

      updateTeacherGender(message);
      addUserMessage(message);

      input.value = "";

      document.getElementById("typing").style.display = "block";
      document.getElementById("status").textContent = "আমি উত্তর তৈরি করছি...";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message,
            gender: teacherGender
          })
        });

        const rawText = await response.text();
        let data;

        try {
          data = JSON.parse(rawText);
        } catch (error) {
          throw new Error("Vercel server error");
        }

        if (!response.ok) {
          throw new Error(data.error || "AI error");
        }

        addTeacherMessage(data.arabic, data.bangla, data.correction);
        speakArabic(data.arabic);

      } catch (error) {
        addTeacherMessage(
          "عَفْوًا",
          error.message,
          "Vercel Logs পরীক্ষা করুন।"
        );
      }

      document.getElementById("typing").style.display = "none";
      document.getElementById("status").textContent = "আমি আপনার কথা শুনছি।";
    }

    function addUserMessage(text) {
      const box = document.createElement("div");
      box.className = "message user-message";

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = "আপনি";

      const content = document.createElement("div");
      content.textContent = text;

      box.appendChild(name);
      box.appendChild(content);

      document.getElementById("chatArea").appendChild(box);

      scrollBottom();
    }

    function addTeacherMessage(arabic, bangla, correction) {
      const box = document.createElement("div");
      box.className = "message teacher-message";

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = teacherGender === "female" ? "👩‍🏫 AI ম্যাডাম" : "👨‍🏫 AI স্যার";

      const arabicText = document.createElement("div");
      arabicText.className = "arabic";
      arabicText.textContent = arabic;

      const banglaText = document.createElement("div");
      banglaText.className = "bangla";
      banglaText.textContent = bangla;

      const correctionText = document.createElement("div");
      correctionText.className = "correction";
      correctionText.textContent = "✏️ " + correction;

      const listenButton = document.createElement("button");
      listenButton.className = "listen";
      listenButton.textContent = "🔊 আরবিতে শুনুন";

      listenButton.onclick = function () {
        speakArabic(arabic);
      };

      box.appendChild(name);
      box.appendChild(arabicText);
      box.appendChild(banglaText);
      box.appendChild(correctionText);
      box.appendChild(listenButton);

      document.getElementById("chatArea").appendChild(box);

      scrollBottom();
    }

    function speakArabic(text) {
      if (!window.speechSynthesis) {
        return;
      }

      window.speechSynthesis.cancel();

      const speech = new SpeechSynthesisUtterance(text);
      speech.lang = "ar-SA";
      speech.rate = 0.75;

      window.speechSynthesis.speak(speech);
    }

    function startListening() {
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        alert("Chrome browser ব্যবহার করুন।");
        return;
      }

      const recognition = new SpeechRecognition();

      recognition.lang = "ar-SA";
      recognition.continuous = false;
      recognition.interimResults = false;

      document.getElementById("status").textContent = "আমি আরবি শুনছি...";

      recognition.onresult = function (event) {
        document.getElementById("messageInput").value =
          event.results[0][0].transcript;

        sendMessage();
      };

      recognition.onerror = function () {
        document.getElementById("status").textContent =
          "কথা শোনা যায়নি। আবার চেষ্টা করুন।";
      };

      recognition.onend = function () {
        document.getElementById("status").textContent =
          "আমি আপনার কথা শুনছি।";
      };

      recognition.start();
    }

    function scrollBottom() {
      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });
    }
  </script>
</body>
</html>
