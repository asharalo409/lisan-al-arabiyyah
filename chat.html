<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AI আরবি শিক্ষক</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans Arabic", sans-serif;
      background: #f4f7f4;
      color: #18352a;
    }

    .app {
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      background: #ffffff;
      padding-bottom: 100px;
    }

    .header {
      padding: 20px 18px 28px;
      background: linear-gradient(135deg, #0b5d3b, #168258);
      color: white;
      border-radius: 0 0 28px 28px;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 14px;
      opacity: 0.95;
    }

    .header h1 {
      margin-top: 17px;
      font-size: 23px;
    }

    .header p {
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.6;
      opacity: 0.94;
    }

    .robot-box {
      margin: -12px 16px 16px;
      padding: 18px;
      border: 1px solid #b8e0c7;
      border-radius: 18px;
      background: #e8f6ee;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.06);
    }

    .robot {
      width: 78px;
      height: 78px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #087443;
      border: 5px solid #d3f1df;
      font-size: 39px;
    }

    .robot.talking {
      animation: talking 0.8s infinite;
    }

    @keyframes talking {
      0% { transform: scale(1); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    .robot-box h2 {
      color: #075b34;
      font-size: 18px;
      margin-bottom: 5px;
    }

    .robot-status {
      color: #547066;
      font-size: 13px;
    }

    .chat-area {
      padding: 0 16px 16px;
    }

    .message {
      max-width: 90%;
      margin-bottom: 14px;
      padding: 13px;
      border-radius: 15px;
      line-height: 1.7;
      font-size: 14px;
    }

    .teacher-message {
      background: #e8f6ee;
      border: 1px solid #b8e0c7;
      border-top-left-radius: 4px;
    }

    .user-message {
      margin-left: auto;
      background: #087443;
      color: white;
      text-align: right;
      direction: rtl;
      font-size: 18px;
      font-family: "Noto Sans Arabic", Arial, sans-serif;
      border-top-right-radius: 4px;
    }

    .name {
      display: block;
      margin-bottom: 6px;
      color: #087443;
      font-size: 12px;
      font-weight: bold;
    }

    .user-message .name {
      color: #d9f5e4;
      text-align: left;
      direction: ltr;
    }

    .arabic-text {
      direction: rtl;
      text-align: right;
      color: #075b34;
      font-family: "Noto Sans Arabic", Arial, sans-serif;
      font-size: 20px;
      line-height: 1.9;
    }

    .bangla-text {
      margin-top: 8px;
      color: #4c6257;
      font-size: 13px;
    }

    .correction {
      margin-top: 10px;
      padding: 9px;
      border-radius: 10px;
      background: #fff7da;
      border: 1px solid #ecd98f;
      color: #685515;
      font-size: 13px;
    }

    .listen-button {
      margin-top: 10px;
      padding: 9px 11px;
      border: none;
      border-radius: 9px;
      background: #d5f0df;
      color: #075b34;
      font-weight: bold;
      cursor: pointer;
    }

    .typing {
      display: none;
      margin: 0 16px 15px;
      color: #587166;
      font-size: 13px;
    }

    .input-box {
      position: fixed;
      bottom: 0;
      left: 50%;
      width: 100%;
      max-width: 520px;
      transform: translateX(-50%);
      padding: 10px 12px;
      background: white;
      border-top: 1px solid #e3eae5;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      height: 47px;
      padding: 10px;
      border: 1px solid #cbdad0;
      border-radius: 12px;
      outline: none;
      font-family: "Noto Sans Arabic", Arial, sans-serif;
      font-size: 17px;
      direction: rtl;
      text-align: right;
    }

    .mic-button,
    .send-button {
      width: 48px;
      height: 47px;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 19px;
      cursor: pointer;
    }

    .mic-button {
      background: #c8483b;
    }

    .mic-button.listening {
      background: #8d1f16;
    }

    .send-button {
      background: #087443;
    }

    .hint {
      margin-top: 7px;
      text-align: center;
      color: #718078;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <main class="app">

    <section class="header">
      <a class="back" href="index.html">← হোমে ফিরে যান</a>

      <h1>AI আরবি শিক্ষক</h1>

      <p>
        আরবিতে বলুন বা লিখুন।<br />
        রোবট শিক্ষক আপনার ভুল ঠিক করবে।
      </p>
    </section>

    <section class="robot-box">
      <div class="robot" id="robot">🤖</div>

      <h2>আরবি শিক্ষক রোবট</h2>

      <p class="robot-status" id="robotStatus">
        আমি আপনার কথা শুনছি।
      </p>
    </section>

    <section class="chat-area" id="chatArea">
      <div class="message teacher-message">
        <span class="name">🤖 AI শিক্ষক</span>

        <div class="arabic-text" lang="ar">
          أَلسَّلَامُ عَلَيْكُمْ
        </div>

        <div class="bangla-text">
          আসসালামু আলাইকুম। আরবিতে আমাকে উত্তর দিন।
        </div>

        <button
          class="listen-button"
          onclick="speakArabic('أَلسَّلَامُ عَلَيْكُمْ')"
        >
          🔊 আরবিতে শুনুন
        </button>
      </div>
    </section>

    <div class="typing" id="typing">
      🤖 শিক্ষক রোবট উত্তর তৈরি করছে...
    </div>

    <section class="input-box">
      <div class="input-row">
        <button
          class="mic-button"
          id="micButton"
          onclick="startListening()"
        >
          🎙️
        </button>

        <input
          id="messageInput"
          placeholder="আরবিতে লিখুন বা 🎙️ চাপুন"
          onkeydown="handleEnter(event)"
        />

        <button class="send-button" onclick="sendMessage()">
          ➤
        </button>
      </div>

      <p class="hint">
        🎙️ চাপুন → আরবিতে বলুন → রোবট শিক্ষকের উত্তর শুনুন
      </p>
    </section>

  </main>

  <script>
    let arabicVoices = [];
    let recognition = null;

    function loadArabicVoices() {
      arabicVoices = window.speechSynthesis.getVoices()
        .filter(function (voice) {
          return voice.lang.toLowerCase().startsWith("ar");
        });
    }

    if ("speechSynthesis" in window) {
      loadArabicVoices();
      window.speechSynthesis.onvoiceschanged = loadArabicVoices;
    }

    function setRobotStatus(text, talking) {
      document.getElementById("robotStatus").textContent = text;

      const robot = document.getElementById("robot");

      if (talking) {
        robot.classList.add("talking");
      } else {
        robot.classList.remove("talking");
      }
    }

    function speakArabic(text) {
      if (!("speechSynthesis" in window)) {
        alert("Chrome browser দিয়ে app খুলুন।");
        return;
      }

      window.speechSynthesis.cancel();

      const speech = new SpeechSynthesisUtterance(text);

      speech.lang = "ar-SA";
      speech.rate = 0.75;

      const voice =
        arabicVoices.find(function (item) {
          return item.lang === "ar-SA";
        }) ||
        arabicVoices.find(function (item) {
          return item.lang.startsWith("ar");
        });

      if (voice) {
        speech.voice = voice;
      }

      speech.onstart = function () {
        setRobotStatus("আমি আরবিতে কথা বলছি...", true);
      };

      speech.onend = function () {
        setRobotStatus("আমি আপনার কথা শুনছি।", false);
      };

      speech.onerror = function () {
        setRobotStatus("আরবি voice চালু নেই। Chrome ব্যবহার করুন।", false);
      };

      window.speechSynthesis.speak(speech);
    }

    function startListening() {
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        alert("Chrome browser দিয়ে app খুলুন।");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = "ar-SA";
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = function () {
        setRobotStatus("আমি আপনার আরবি কথা শুনছি...", true);
        document.getElementById("micButton").classList.add("listening");
      };

      recognition.onresult = function (event) {
        document.getElementById("messageInput").value =
          event.results[0][0].transcript;

        sendMessage();
      };

      recognition.onerror = function () {
        setRobotStatus("কথা শোনা যায়নি। আবার চেষ্টা করুন।", false);
      };

      recognition.onend = function () {
        document.getElementById("micButton").classList.remove("listening");
      };

      recognition.start();
    }

    function handleEnter(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }

    async function sendMessage() {
      const input = document.getElementById("messageInput");
      const message = input.value.trim();

      if (!message) {
        return;
      }

      addUserMessage(message);

      input.value = "";

      document.getElementById("typing").style.display = "block";

      setRobotStatus("আমি আপনার বাক্য ঠিক করছি...", true);

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "AI error");
        }

        addTeacherMessage(
          data.arabic,
          data.bangla,
          data.correction
        );

      } catch (error) {
        addTeacherMessage(
          "عَفْوًا، حَاوِلْ مَرَّةً أُخْرَى",
          error.message || "AI শিক্ষক এখন উত্তর দিতে পারছে না।",
          ""
        );
      }

      document.getElementById("typing").style.display = "none";
      setRobotStatus("আমি আপনার কথা শুনছি।", false);
    }

    function addUserMessage(text) {
      const chatArea = document.getElementById("chatArea");

      const message = document.createElement("div");

      message.className = "message user-message";

      message.innerHTML =
        '<span class="name">আপনি</span>' +
        escapeHtml(text);

      chatArea.appendChild(message);

      scrollBottom();
    }

    function addTeacherMessage(arabic, bangla, correction) {
      const chatArea = document.getElementById("chatArea");

      const message = document.createElement("div");

      message.className = "message teacher-message";

      message.innerHTML =
        '<span class="name">🤖 AI শিক্ষক</span>' +
        '<div class="arabic-text" lang="ar">' +
        escapeHtml(arabic) +
        '</div>' +
        '<div class="bangla-text">' +
        escapeHtml(bangla) +
        '</div>' +
        '<div class="correction">✏️ ' +
        escapeHtml(correction) +
        '</div>' +
        '<button class="listen-button">🔊 আরবিতে শুনুন</button>';

      message.querySelector(".listen-button").onclick = function () {
        speakArabic(arabic);
      };

      chatArea.appendChild(message);

      scrollBottom();

      speakArabic(arabic);
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function scrollBottom() {
      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });
    }
  </script>

</body>
</html>
