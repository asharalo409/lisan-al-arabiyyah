    function showMenu() {
      document.getElementById("menu").style.display = "block";
      document.getElementById("lessonPage").style.display = "none";
    }

    function openLesson(index) {
      const lesson = lessons[index];

      document.getElementById("menu").style.display = "none";
      document.getElementById("lessonPage").style.display = "block";

      document.getElementById("lessonTitle").textContent = lesson.title;

      const lessonLines = document.getElementById("lessonLines");
      lessonLines.innerHTML = "";

      for (let i = 0; i < lesson.lines.length; i++) {
        const box = document.createElement("div");
        box.className = "line";

        const arabic = document.createElement("div");
        arabic.className = "arabic";
        arabic.textContent = (i + 1) + ". " + lesson.lines[i][0];

        const bangla = document.createElement("div");
        bangla.className = "bangla";
        bangla.textContent = lesson.lines[i][1];

        const button = document.createElement("button");
        button.className = "listen";
        button.textContent = "🔊 শুনুন";

        button.onclick = function () {
          speakArabic(lesson.lines[i][0]);
        };

        box.appendChild(arabic);
        box.appendChild(bangla);
        box.appendChild(button);

        lessonLines.appendChild(box);
      }

      window.scrollTo(0, 0);
    }

    function speakArabic(text) {
      window.speechSynthesis.cancel();

      const speech = new SpeechSynthesisUtterance(text);

      speech.lang = "ar-SA";
      speech.rate = 0.75;

      window.speechSynthesis.speak(speech);
    }

    function createMenu() {
      const menu = document.getElementById("menu");

      for (let i = 0; i < lessons.length; i++) {
        const button = document.createElement("button");

        button.className = "lesson-button";
        button.textContent = lessons[i].title;

        button.onclick = function () {
          openLesson(i);
        };

        menu.appendChild(button);
      }
    }

    createMenu();
